name: Gemini Commit Review

on:
  push:
    branches:
      - main
    paths:
      - 'Assets/02.Scripts/**/*.cs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gemini-commit-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  review:
    name: Review C# commit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. 저장소 가져오기
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # 2. 이번 커밋에서 변경된 C# 코드만 diff로 저장
      - name: Create commit diff
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if git rev-parse "${COMMIT_SHA}^" > /dev/null 2>&1; then
            git diff \
              --no-ext-diff \
              --unified=30 \
              "${COMMIT_SHA}^" \
              "${COMMIT_SHA}" \
              -- ':(glob)Assets/02.Scripts/**/*.cs' > commit.diff
          else
            git show \
              --format= \
              --no-ext-diff \
              --unified=30 \
              "${COMMIT_SHA}" \
              -- ':(glob)Assets/02.Scripts/**/*.cs' > commit.diff
          fi

          if [ ! -s commit.diff ]; then
            echo "No C# changes found."
            exit 0
          fi

      # 3. Gemini에게 전달할 프롬프트 생성
      - name: Create review prompt
        shell: bash
        run: |
          {
            echo "당신은 Unity C# 코드 리뷰어입니다."
            echo
            echo "아래는 이번 커밋에서 변경된 C# 코드입니다."
            echo
            echo "다음 항목을 중심으로 검토하세요:"
            echo "- 실제 버그 또는 런타임 오류 가능성"
            echo "- NullReferenceException 등 예외 가능성"
            echo "- Unity 생명주기 및 API 사용 문제"
            echo "- 프레임 레이트 의존성"
            echo "- 성능 및 메모리 문제"
            echo "- 객체지향 설계와 책임 분리"
            echo "- 코드 가독성"
            echo
            echo "단순 취향 차이나 과도한 리팩터링은 지적하지 마세요."
            echo "문제가 있다면 중요도, 위치, 원인, 발생 가능한 결과, 수정 방법을 설명하세요."
            echo

            if [ -f GEMINI.md ]; then
              echo "=== Repository Review Rules ==="
              cat GEMINI.md
              echo
            fi

            echo "=== Commit Diff ==="
            cat commit.diff
          } > prompt.txt

      # 4. Gemini 3.8 Flash API 직접 호출
      - name: Run Gemini 3.8 review
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          jq -n \
            --rawfile prompt prompt.txt \
            '{
              contents: [
                {
                  parts: [
                    {
                      text: $prompt
                    }
                  ]
                }
              ],
              generationConfig: {
                thinkingConfig: {
                  thinkingLevel: "medium"
                }
              }
            }' > request.json

          # JSON 자체가 정상인지 검사
          jq empty request.json

          python3 <<'PY'
          import json
          import os
          import sys
          import urllib.request
          import urllib.error

          url = (
              "https://generativelanguage.googleapis.com/v1beta/"
              "models/gemini-3.8-flash:generateContent"
          )

          with open("request.json", "rb") as f:
              data = f.read()

          request = urllib.request.Request(
              url,
              data=data,
              method="POST",
              headers={
                  "x-goog-api-key": os.environ["GEMINI_API_KEY"],
                  "Content-Type": "application/json",
              },
          )

          try:
              with urllib.request.urlopen(request) as response:
                  body = response.read()

                  with open("response.json", "wb") as f:
                      f.write(body)

                  print(f"Gemini API request succeeded. HTTP {response.status}")

          except urllib.error.HTTPError as e:
              body = e.read()

              with open("response.json", "wb") as f:
                  f.write(body)

              print(f"Gemini API request failed. HTTP {e.code}")
              print(body.decode("utf-8", errors="replace"))
              sys.exit(1)
          PY

          jq -r '
            [
              .candidates[0].content.parts[]?
              | select(.text != null)
              | .text
            ]
            | join("\n")
          ' response.json > review.md

          if [ ! -s review.md ]; then
            echo "Gemini returned an empty review."
            cat response.json
            exit 1
          fi

          echo "Gemini 3.8 review completed."

      # 5. 리뷰 결과를 저장소에 커밋
      - name: Commit review
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add review.md

          if git diff --cached --quiet; then
            echo "No review changes to commit."
            exit 0
          fi

          git commit -m "docs: update Gemini code review"

          git push \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:${GITHUB_REF_NAME}